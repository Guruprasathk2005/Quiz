<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GP Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>GP Quiz</h1>

<div class="container" id="login-container">
  <input type="text" id="name" placeholder="Enter Name" required><br>
  <input type="email" id="email" placeholder="Enter Email" required><br>
  <input type="text" id="joinCode" placeholder="Enter Join Code" required><br>
  <button onclick="startQuiz()">Start Quiz</button>
</div>

<div class="container" id="quiz-container" style="display:none;"></div>

<script src="script.js"></script>
</body>
</html>
